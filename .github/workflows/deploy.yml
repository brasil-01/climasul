name: deploy

on:
  push:
    branches: [main]

# Deploy de produção via Vercel. Requer o secret VERCEL_TOKEN em
# Settings → Secrets and variables → Actions. Sem o segredo, o job passa verde
# apenas pulando o deploy (nenhuma falha); o deploy também pode ser feito pelo
# botão Redeploy da Vercel.
jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check VERCEL_TOKEN
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN não configurado — pulando deploy (configure em Settings → Secrets and variables → Actions)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'

      - name: Install Vercel CLI
        if: steps.check.outputs.skip == 'false'
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        if: steps.check.outputs.skip == 'false'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (uses the project's install/build commands)
        if: steps.check.outputs.skip == 'false'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: steps.check.outputs.skip == 'false'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
